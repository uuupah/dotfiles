debug:disable_logs = false

#### MONITORS ####

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1, 1920x1200@60, 0x0, 1
# TODO make workspaces behave the way i want them to in the future
# monitor = , disabled

#### KEYWORDS ####

# See https://wiki.hyprland.org/Configuring/Keywords/
$terminal = alacritty
$fileManager = nemo
$menu = tofi-drun -c ~/.config/tofi/config --drun-launch=true
$browser = librewolf

#### AUTOSTART ####

#exec-once = mako -c /home/uuu/.config/mako/config # mako is nice but doesnt scale properly with aliased fonts
exec-once = dunst
exec-once = hyprpaper
#exec-once = hypridle
exec-once = syncthing serve --no-browser
exec-once = tailscale up
exec-once = $HOME/.config/waybar/scripts/startandwatchwaybar
exec-once = wl-paste --watch cliphist store # cliphist

#### ENVIRONMENT VARIABLES ####

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#### LOOK AND FEEL ####

# Refer to https://wiki.hyprland.org/Configuring/Variables/
general {
    gaps_in = 4
    gaps_out = 8

    border_size = 0
#    col.active_border = rgb(70c0b1)
    col.active_border = rgb(DBBC7F)
#    col.inactive_border = rgb(595959)
    col.inactive_border = rgb(232A2E)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1

    dim_inactive = true
    dim_strength = 0.4
    dim_special = 0.6
    
    shadow {
        enabled = false
    }

    blur {
        enabled = false
        size = 6
        passes = 2
        ignore_opacity = true
        new_optimizations = true
        special = true
        popups = true
    }
}

animations {
    enabled = 1
    animation = windows, 0, 0.5, linear, slide
    animation = layers, 0
    animation = fade, 1, 0.4, linear
    animation = border, 0
    animation = borderangle, 0
    animation = workspaces, 0, 1, linear
    animation = zoomFactor, 0
    animation = monitorAdded, 0
}

misc {
    disable_hyprland_logo = true
    vfr = true
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

#### INPUT ####

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

#### KEYBINDINGS ####

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive
bind = $mainMod, M, exec, ~/.config/tofi/scripts/powermenu
bind = $mainMod, M, focuswindow, class:tofi
bind = $mainMod, R, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, K, exec, keepassxc
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Y, exec, librewolf
bind = $mainMod, O, exec, /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=obsidian.sh --file-forwarding md.obsidian.Obsidian @@u %U @@
bind = $mainMod, f, fullscreen, 1
bind = $mainMod, J, togglesplit
bind = $mainMod, shift c, exec, hyprpicker -a 
bind = $mainMod, period, exec, $HOME/.config/tofi/scripts/bemoji -t -f /home/uuu/.config/bemoji/emojis.txt
bind = $mainMod shift, S, exec, $HOME/scripts/grimsavescreenshotandcopytoclipboard
bind = $mainMod shift, C, exec, hyprpicker -a
bind = $mainMod, semicolon, exec, hyprctl keyword decoration:dim_inactive true && notify-send -t 750 -i display-brightness "dimming inactive windows"
bind = $mainMod, apostrophe, exec, hyprctl keyword decoration:dim_inactive false && notify-send -t 750 -i display-brightness "undimming inactive windows"
bind = $mainMod, B, exec, $HOME/.config/tofi/scripts/remoteconnections
bind = $mainMod, slash, exec, $HOME/.config/tofi/scripts/tools

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# switch workspaces
bind = control alt, 1, workspace, 1
bind = control alt, 2, workspace, 2
bind = control alt, 3, workspace, 3
bind = control alt, 4, workspace, 4
bind = control alt, 5, workspace, 5
bind = control alt, 6, workspace, 6
bind = control alt, 7, workspace, 7
bind = control alt, 8, workspace, 8
bind = control alt, 9, workspace, 9

# switch workspaces relatively
#bind = control alt, left, workspace, -1
bind = control alt, left, exec, hyprnome --previous --keep-special
#bind = control alt, right, workspace, +1
bind = control alt, right, exec, hyprnome --keep-special

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = control alt shift, 1, movetoworkspace, 1
bind = control alt shift, 2, movetoworkspace, 2
bind = control alt shift, 3, movetoworkspace, 3
bind = control alt shift, 4, movetoworkspace, 4
bind = control alt shift, 5, movetoworkspace, 5
bind = control alt shift, 6, movetoworkspace, 6
bind = control alt shift, 7, movetoworkspace, 7
bind = control alt shift, 8, movetoworkspace, 8
bind = control alt shift, 9, movetoworkspace, 9
bind = control alt shift, left, movetoworkspace, -1
bind = control alt shift, right, movetoworkspace, +1

# special workspace
bind = control alt, S, togglespecialworkspace, S
bind = control alt shift, S, movetoworkspace, special:S

# move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, left, alterzorder, top
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, right, alterzorder, top
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, up, alterzorder, top
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, down, alterzorder, top

# change size of windows
binde = $mainMod CTRL, left, resizeactive, -15 0
binde = $mainMod CTRL, right, resizeactive, 15 0
binde = $mainMod CTRL, up, resizeactive, 0 -15
binde = $mainMod CTRL, down, resizeactive, 0 15

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0
bindel = ,XF86AudioRaiseVolume, exec, $HOME/.config/dunst/dunst-media-control volume_up
bindel = ,XF86AudioLowerVolume, exec, $HOME/.config/dunst/dunst-media-control volume_down
bindel = ,XF86AudioMute, exec, $HOME/.config/dunst/dunst-media-control volume_mute
bindel = ,XF86AudioMicMute, exec, $HOME/.config/dunst/dunst-media-control mic_mute
bindel = ,XF86MonBrightnessUp, exec, $HOME/.config/dunst/dunst-media-control brightness_up
bindel = ,XF86MonBrightnessDown, exec, $HOME/.config/dunst/dunst-media-control brightness_down

# Requires playerctl
bindl = , XF86AudioNext, exec, $HOME/.config/dunst/dunst-media-control next_track
bindl = , XF86AudioPause, exec, $HOME/.config/dunst/dunst-media-control play_pause
bindl = , XF86AudioPlay, exec, $HOME/.config/dunst/dunst-media-control play_pause
bindl = , XF86AudioPrev, exec, $HOME/.config/dunst/dunst-media-control prev_track

#### WINDOWS AND WORKSPACES ####

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# float "open folder" prompts - made for zed but should work for any xdg-desktop-portal file picker
windowrule = float, title:(?i)open(.*)folder(.*)
windowrule = float, title:(?i)open(.*)file(.*)
windowrule = float, title:(?i)save(.*)as(.*)

# firefox picture-in-picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 71% 73%, title:^(Picture-in-Picture)$
windowrulev2 = size 27.75% 25%, title:^(Picture-in-Picture)$
#windowrulev2 = opacity 1 0.65, floating:1

# remove gaps when window is fullscreen
workspace = w[t1], gapsout:0
workspace = w[t1], border:0
#workspace = f[1], gapsout:0
#workspace = f[1], border:0

workspace = s[1], gapsout:30
workspace = s[1], gapsin:10
workspace = s[1], border:true
