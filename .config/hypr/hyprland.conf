debug:disable_logs = false

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1, 1920x1200@60, 0x0, 1
# TODO make workspaces behave the way i want them to in the future
monitor=, disabled

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = nemo
$menu = tofi-drun -c ~/.config/tofi/config --drun-launch=true


################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

#exec-once = swaync
#exec-once = mako -c /home/uuu/.config/mako/config # mako is nice but doesnt scale properly with aliased fonts
exec-once = dunst -c /home/uuu/.config/dunst/dunstrc
exec-once = hyprpaper
exec-once = hypridle
exec-once = syncthing serve --no-browser
exec-once = tailscale up
exec-once = /home/uuu/scripts/startandwatchwaybar
exec-once = wl-paste --watch cliphist store # cliphist

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 3

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(70c0b1)
#    col.active_border = rgb(E7C547)
    col.inactive_border = rgb(595959)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.8

    shadow {
        enabled = false
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true
        new_optimizations = true
        special = true
        popups = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = 0

    animation = windows, 0
    animation = layers, 0
    animation = fade, 0
    animation = border, 0
    animation = borderangle, 0

    animation = workspaces, 0, 0.5, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
#    no_gaps_when_only=true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive
bind = alt,      F4, killactive
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, slash, exec, hyprlock
bind = $mainMod, period, exec, splatmoji copypaste # using type would be better here but ydotool needs some tweaking

bind = $mainMod, Y, exec, librewolf
bind = $mainMod, O, exec, /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=obsidian.sh --file-forwarding md.obsidian.Obsidian @@u %U @@

bind = $mainMod shift,c, exec, grim -g "$(slurp -d -c C5C8C6)" $(xdg-user-dir PICTURES)/screenshot_$(date +%Y_%m_%d_%H_%M_%S).png
#bind = $mainMod, period, exec, ~/scripts/openemojipickerwayland

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, j, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, l, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, i, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, k, movefocus, d

# switch workspaces
bind = control alt, 1, workspace, 1
bind = control alt, 2, workspace, 2
bind = control alt, 3, workspace, 3
bind = control alt, 4, workspace, 4
bind = control alt, 5, workspace, 4
bind = control alt, 6, workspace, 4
bind = control alt, 7, workspace, 4
bind = control alt, 8, workspace, 4
bind = control alt, 9, workspace, 4

# switch workspaces relatively
bind = control alt, left, workspace, -1
bind = control alt, j, workspace, -1
bind = control alt, right, workspace, +1
bind = control alt, l, workspace, +1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = control alt shift, 1, movetoworkspace, 1
bind = control alt shift, 2, movetoworkspace, 2
bind = control alt shift, 3, movetoworkspace, 3
bind = control alt shift, 4, movetoworkspace, 4
bind = control alt shift, 5, movetoworkspace, 4
bind = control alt shift, 6, movetoworkspace, 4
bind = control alt shift, 7, movetoworkspace, 4
bind = control alt shift, 8, movetoworkspace, 4
bind = control alt shift, 9, movetoworkspace, 4
bind = control alt shift, left, movetoworkspace, -1
bind = control alt shift, j, movetoworkspace, -1
bind = control alt shift, right, movetoworkspace, +1
bind = control alt shift, l, movetoworkspace, +1

# Example special workspace (scratchpad)
 bind = $mainMod, S, togglespecialworkspace, S
 bind = control alt shift, S, movetoworkspace, special:S

# make window fullscreen
# TODO figure out a way to show that there are other windows on the screen
bind = $mainMod, f, fullscreen, 1

bind = $mainMod, space, togglesplit

#bind = $mainMod, v, togglefloating
#bind = $mainMod, b, settiled

# move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, left, alterzorder, top
bind = $mainMod SHIFT, j, movewindow, l
bind = $mainMod SHIFT, j, alterzorder, top
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, right, alterzorder, top
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, l, alterzorder, top
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, up, alterzorder, top
bind = $mainMod SHIFT, i, movewindow, u
bind = $mainMod SHIFT, i, alterzorder, top
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, down, alterzorder, top
bind = $mainMod SHIFT, k, movewindow, d
bind = $mainMod SHIFT, k, alterzorder, top

# change size of windows
binde = $mainMod CTRL, left, resizeactive, -10 0
binde = $mainMod CTRL, j, resizeactive, -10 0
binde = $mainMod CTRL, right, resizeactive, 10 0
binde = $mainMod CTRL, l, resizeactive, 10 0
binde = $mainMod CTRL, up, resizeactive, 0 -10
binde = $mainMod CTRL, i, resizeactive, 0 -10
binde = $mainMod CTRL, down, resizeactive, 0 10
binde = $mainMod CTRL, k, resizeactive, 0 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
#bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
#bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrule = float, title:"open folder"

windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 73% 73%, title:^(Picture-in-Picture)$
windowrulev2 = size 25% 25%, title:^(Picture-in-Picture)$
#windowrulev2 = opacity 1 0.65, floating:1

# remove gaps when window is fullscreen
workspace = w[t1], gapsout:0
workspace = w[t1], border:0
workspace = f[1], gapsout:0
workspace = f[1], border:0

