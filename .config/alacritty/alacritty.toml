
[window]
title = "alacritty"
dimensions = { columns = 80, lines = 24 }
padding = { x = 1, y = 1 }

[font]
normal = { family = "ProggyClean Nerd Font Mono", style = "Regular" }
bold  = { family = "ProggyClean Nerd Font Mono", style = "Bold" }
italic = { family = "ProggyClean Nerd Font Mono", style = "Italic" }
bold_italic = { family = "ProggyClean Nerd Font Mono", style = "Bold Italic" }
size = 12

[general]
import = [
  "~/.config/alacritty/themes/themes/alacritty_0_12.toml"
]

[keyboard]
bindings = [
{ key = "PageUp", action = "ScrollLineUp" },
{ key = "PageUp", mods="Control", action = "ScrollHalfPageUp" },
{ key = "PageDown", action = "ScrollLineDown" },
{ key = "PageDown", mods="Control", action = "ScrollHalfPageDown" },
]
