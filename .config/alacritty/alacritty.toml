[general]
import = [
  "defaults.toml",
  "themes/uuu.toml",
  "device.toml"
]

[keyboard]
bindings = [
{ key = "PageUp", action = "ScrollLineUp" },
{ key = "PageUp", mods="Control", action = "ScrollHalfPageUp" },
{ key = "PageDown", action = "ScrollLineDown" },
{ key = "PageDown", mods="Control", action = "ScrollHalfPageDown" },
]
